[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awnstudio"
version = "0.1.0.dev0"
description = "Automated wheat awn length measurement from digitized spikelet pages"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python",
  "shapely>=2",
  "scikit-image",
  "pyyaml",
  "openpyxl",
  "ultralytics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
